[workspace]
resolver = "3"
members = ["crates/wraith-core", "crates/wraith"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
authors = ["wraith contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/wraith-rs/wraith"
readme = "README.md"
keywords = ["svg", "png", "vectorize", "trace", "minify"]
categories = ["command-line-utilities", "graphics", "multimedia::images"]

[workspace.dependencies]
wraith-core = { version = "0.1.0", path = "crates/wraith-core" }
anyhow = "1.0.100"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
clap_complete = "4.6.7"
image = { version = "0.25.10", default-features = false, features = ["png"] }
oxvg_ast = { version = "0.0.9", features = ["roxmltree"] }
oxvg_optimiser = "0.0.9"
rayon = "1.12.0"
thiserror = "2.0.18"
vtracer = "0.6.5"
visioncortex = "0.8.8"

# dev / bench
criterion = "0.8.2"
tempfile = "3.24.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = false
panic = "unwind"
