[package]
name = "wraith-core"
description = "Blazing-fast PNG → optimised SVG pipeline: trace, normalise, minify."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# Render-back quality metrics (`wraith_core::metrics`): rasterises SVG output
# with resvg and scores it against a reference raster. Off by default so the
# core pipeline stays dependency-light; the `wraith` CLI and `wraith-eval`
# enable it.
metrics = ["dep:resvg"]

[dependencies]
image = { workspace = true }
oxvg_ast = { workspace = true }
oxvg_optimiser = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }
vtracer = { workspace = true }
visioncortex = { workspace = true }
resvg = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
image = { workspace = true }
tempfile = { workspace = true }

[lib]
bench = false

[[bench]]
name = "pipeline"
harness = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
