# git-cliff configuration for wraith — Conventional Commits → Keep a Changelog.
# https://git-cliff.org/docs/configuration

[changelog]
title = "<!-- markdownlint-disable MD041 -->\n# Changelog\n\nAll notable changes to this project will be documented in this file.\n\nThe format is based on [Keep a Changelog](https://keepachangelog.com/),\nand this project adheres to [Semantic Versioning](https://semver.org/).\n"
header = "# Changelog\n\nAll notable changes to this project will be documented in this file.\n\nThe format is based on [Keep a Changelog](https://keepachangelog.com/),\nand this project adheres to [Semantic Versioning](https://semver.org/).\n"
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}

### {{ group | upper_first }}

{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{{ commit.message | upper_first }} — {{ commit.id | truncate(length=7, end="") }}
{% endfor %}
{% endfor %}

{% if version and previous and previous.commit_id %}
[{{ version | trim_start_matches(pat="v") }}]: https://github.com/wraith-rs/wraith/compare/{{ previous.commit_id }}...{{ commit_id }}
{% endif %}
"""
footer = "<!-- generated by git-cliff -->\n"
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^doc", group = "Documentation" },
  { message = "^refactor", group = "Refactor" },
  { message = "^test", group = "Tests" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps.*\\)", skip = true },
  { message = "^chore", group = "Miscellaneous" },
  { message = "^ci", group = "Continuous Integration" },
  { message = ".*security", group = "Security" },
  { message = ".*", group = "Other" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"
